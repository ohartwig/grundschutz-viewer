<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grundschutz++ Register</title>
<style>
/* Layout: Register. Links das Verzeichnis aller Anforderungen als Kästchen je Praxis, rechts die Akte des gewählten Eintrags. Jede Kennung ist ein Link; Zustand steckt in der Form des Kästchens, nicht nur in der Farbe. */
:root {
  --paper: #f6f7f8;
  --sheet: #ffffff;
  --ink: #17212b;
  --ink2: #4a5561;
  --ink3: #6b7580;
  --rule: #d6dbe0;
  --rule2: #e8ebee;
  --link: #1d5c8a;
  --mark: #17212b;
  --bad: #b3261e;
  --warn: #9a5800;
  --sel: #1d5c8a;
  --code: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --text: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --head: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12171c; --sheet: #182027; --ink: #e3e8ec; --ink2: #aab4be; --ink3: #8a95a0; --rule: #2e3a45; --rule2: #24303a;
  --link: #8cc2ec; --mark: #dfe6ec; --bad: #ff8a80; --warn: #f0b35a; --sel: #8cc2ec; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #12171c; --sheet: #182027; --ink: #e3e8ec; --ink2: #aab4be; --ink3: #8a95a0; --rule: #2e3a45; --rule2: #24303a;
  --link: #8cc2ec; --mark: #dfe6ec; --bad: #ff8a80; --warn: #f0b35a; --sel: #8cc2ec; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.5; }
.page { max-width: 1360px; margin: 0 auto; padding-inline: 20px; padding-block: 16px 48px; display: flex; flex-direction: column; gap: 20px; }
a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.id { font-family: var(--code); font-weight: 500; font-size: .93em; white-space: nowrap; }
.small { font-size: 13px; color: var(--ink3); }
.num { font-variant-numeric: tabular-nums; }

/* Kopfzeile */
.mast { display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.mast .name { font-family: var(--head); font-weight: 600; font-size: 22px; letter-spacing: .01em; }
.mast .name span { color: var(--ink3); font-weight: 500; }
.mast .meta { font-family: var(--code); font-size: 12.5px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 4px 16px; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; }
nav.tabs a { text-decoration: none; color: var(--ink2); padding: 6px 0; border-bottom: 2px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }

/* Lage in einem Satz und Läufe */
.state { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 16px 40px; align-items: end; }
.state p { margin: 0; font-size: 17px; max-width: 70ch; }
.state b { font-weight: 600; }
.runs { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.runs svg { width: 100%; height: 34px; display: block; }
@media (max-width: 860px) { .state { grid-template-columns: minmax(0, 1fr); } }

/* Zeichen für den Stand: Form trägt die Bedeutung */
.sq { --s: 14px; width: var(--s); height: var(--s); border: 1.5px solid var(--mark); display: inline-block; position: relative; flex: none; vertical-align: -2px; background: transparent; }
.sq.I { background: var(--mark); }
.sq.P { background: linear-gradient(135deg, var(--mark) 0 50%, transparent 50% 100%); }
.sq.m::after { content: ""; position: absolute; inset: 0; margin: auto; width: 4px; height: 4px; border-radius: 50%; background: var(--paper); box-shadow: 0 0 0 1.5px var(--mark); }
.sq.L.m::after, .sq.P.m::after { background: var(--mark); box-shadow: none; }
.sq.od { border-color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* Arbeitsfläche */
.work { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 960px) { .work { grid-template-columns: minmax(0, 1fr); } }
.reg { display: flex; flex-direction: column; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 960px) { .reg { position: static; } }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { font: inherit; font-size: 13px; color: var(--ink2); background: var(--sheet); border: 1px solid var(--rule); padding: 5px 10px; cursor: pointer; min-height: 32px; }
.filters button[aria-pressed="true"] { color: var(--sheet); background: var(--ink); border-color: var(--ink); }
.prac { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 8px; align-items: start; padding-block: 6px; border-top: 1px solid var(--rule2); }
.prac .lbl { font-size: 12.5px; line-height: 1.25; color: var(--ink2); padding-top: 1px; min-width: 0; hyphens: auto; overflow-wrap: anywhere; }
.prac .lbl .id { color: var(--ink); display: block; }
.cells { display: flex; flex-wrap: wrap; gap: 3px; }
.cells a { display: inline-flex; padding: 1px; border: 1px solid transparent; }
.cells a .sq { --s: 13px; }
.cells a[aria-current="true"] { border-color: var(--sel); outline: 1px solid var(--sel); }
.cells a.dim { opacity: .18; }
.cells a:hover { border-color: var(--ink3); }
.prac .cnt { grid-column: 2; font-size: 12px; color: var(--ink3); font-variant-numeric: tabular-nums; }

/* Akte */
.file { background: var(--sheet); border: 1px solid var(--rule); padding: 24px clamp(16px, 3vw, 32px) 28px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.crumb { font-size: 13px; color: var(--ink3); display: flex; flex-wrap: wrap; gap: 2px 8px; }
.crumb span + span::before { content: "›"; margin-right: 8px; color: var(--rule); }
h1 { margin: 0; font-family: var(--head); font-weight: 600; font-size: clamp(24px, 3vw, 30px); line-height: 1.15; text-wrap: balance; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
h1 .id { font-size: .8em; font-weight: 600; }
h2 { margin: 0; font-family: var(--head); font-weight: 600; font-size: 18px; }
.lead { margin: 0; font-size: 17px; max-width: 68ch; }
.lead .mv { font-weight: 600; letter-spacing: .04em; font-size: .92em; }
details.hint summary { cursor: pointer; font-size: 13.5px; color: var(--link); }
details.hint p { margin: 8px 0 0; max-width: 72ch; color: var(--ink2); font-size: 14.5px; }
dl.facts { margin: 0; display: grid; grid-template-columns: 170px minmax(0, 1fr); border-top: 1px solid var(--rule); }
dl.facts dt, dl.facts dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--rule2); }
dl.facts dt { font-size: 13px; color: var(--ink3); padding-right: 16px; padding-top: 12px; }
dl.facts dd { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 560px) { dl.facts { grid-template-columns: minmax(0, 1fr); } dl.facts dt { border-bottom: 0; padding-bottom: 0; } }
.ref { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ref .t { color: var(--ink); }
.ref .q { font-size: 12.5px; color: var(--ink3); }
.none { color: var(--ink3); font-size: 14px; }
.bad { color: var(--bad); font-weight: 500; }
.warn { color: var(--warn); }
.tag { font-family: var(--code); font-size: 11.5px; border: 1px solid var(--rule); padding: 0 5px; color: var(--ink2); white-space: nowrap; }
.src { font-size: 12.5px; color: var(--ink3); border-top: 1px solid var(--rule2); padding-top: 12px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tw { overflow-x: auto; }
th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--ink3); padding: 6px 12px 6px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule2); vertical-align: top; }
td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .file { animation: in .14s ease-out; } @keyframes in { from { opacity: .4; } to { opacity: 1; } } }
</style>

<div class="page" lang="de">
  <header class="mast">
    <div class="name">Grundschutz++ Register <span id="proj"></span></div>
    <div class="meta" id="meta"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Ansichten">
    <a href="#">Übersicht</a>
    <a href="#pruefungen">Prüfungen</a>
    <a href="#massnahmen">Maßnahmenplan</a>
    <a href="#normen">Normen</a>
    <a href="#gefaehrdungen">Gefährdungen</a>
  </nav>
  <section class="state">
    <p id="sum"></p>
    <div class="runs">
      <svg id="runsvg" role="img" aria-label="Läufe"></svg>
      <div class="small" id="runcap"></div>
    </div>
  </section>
  <div class="work">
    <aside class="reg" aria-label="Verzeichnis der Anforderungen">
      <div class="legend">
        <span><i class="sq I"></i>erfüllt</span><span><i class="sq P"></i>nicht erfüllt, teilweise</span><span><i class="sq L"></i>nicht erfüllt, geplant</span><span><i class="sq I m"></i>gemessen</span><span><i class="sq L od"></i>Termin überschritten</span>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Hervorheben"></div>
      <div id="reg"></div>
    </aside>
    <main class="file" id="file" tabindex="-1"></main>
  </div>
</div>

<script>
const D = /*__DATA__*/null;
const THREAT = {"G 0.1":"Feuer","G 0.2":"Ungünstige klimatische Bedingungen","G 0.3":"Wasser","G 0.4":"Verschmutzung, Staub, Korrosion","G 0.5":"Naturkatastrophen","G 0.6":"Katastrophen im Umfeld","G 0.7":"Großereignisse im Umfeld","G 0.8":"Ausfall oder Störung der Stromversorgung","G 0.9":"Ausfall oder Störung von Kommunikationsnetzen","G 0.10":"Ausfall oder Störung von Versorgungsnetzen","G 0.11":"Ausfall oder Störung von Dienstleistern","G 0.12":"Elektromagnetische Störstrahlung","G 0.13":"Abfangen kompromittierender Strahlung","G 0.14":"Ausspähen von Informationen (Spionage)","G 0.15":"Abhören","G 0.16":"Diebstahl von Geräten, Datenträgern oder Dokumenten","G 0.17":"Verlust von Geräten, Datenträgern oder Dokumenten","G 0.18":"Fehlplanung oder fehlende Anpassung","G 0.19":"Offenlegung schützenswerter Informationen","G 0.20":"Informationen oder Produkte aus unzuverlässiger Quelle","G 0.21":"Manipulation von Hard- oder Software","G 0.22":"Manipulation von Informationen","G 0.23":"Unbefugtes Eindringen in IT-Systeme","G 0.24":"Zerstörung von Geräten oder Datenträgern","G 0.25":"Ausfall von Geräten oder Systemen","G 0.26":"Fehlfunktion von Geräten oder Systemen","G 0.27":"Ressourcenmangel","G 0.28":"Software-Schwachstellen oder -Fehler","G 0.29":"Verstoß gegen Gesetze oder Regelungen","G 0.30":"Unberechtigte Nutzung oder Administration von Geräten und Systemen","G 0.31":"Fehlerhafte Nutzung oder Administration von Geräten und Systemen","G 0.32":"Missbrauch von Berechtigungen","G 0.33":"Personalausfall","G 0.34":"Anschlag","G 0.35":"Nötigung, Erpressung oder Korruption","G 0.36":"Identitätsdiebstahl","G 0.37":"Abstreiten von Handlungen","G 0.38":"Missbrauch personenbezogener Daten","G 0.39":"Schadprogramme","G 0.40":"Verhinderung von Diensten (Denial of Service)","G 0.41":"Sabotage","G 0.42":"Social Engineering","G 0.43":"Einspielen von Nachrichten","G 0.44":"Unbefugtes Eindringen in Räumlichkeiten","G 0.45":"Datenverlust","G 0.46":"Integritätsverlust schützenswerter Informationen","G 0.47":"Schädliche Seiteneffekte IT-gestützter Angriffe"};
const ISO_THEME = {"5":"Organisatorische Maßnahmen","6":"Personenbezogene Maßnahmen","7":"Physische Maßnahmen","8":"Technologische Maßnahmen"};
const REL = {"equivalent-to":"gleichwertig","subset-of":"Teilmenge","intersects-with":"überschneidend","superset-of":"Obermenge"};
// Stand nach BSI-Standard 300-1 (4.1): erfüllt, nicht erfüllt, nicht anwendbar. Teilweise und geplant bleiben als Einzelheit.
const ST = {I: "erfüllt", P: "nicht erfüllt, teilweise", L: "nicht erfüllt, geplant", "-": "ohne Angabe"};
const NF = {temporary: "temporär", permanent: "dauerhaft"};
const stLabel = r => ST[r.st] + (r.st !== "I" && NF[r.nf] ? ", " + NF[r.nf] : "");
const devText = r => `Abweichung genehmigt: dauerhaft nicht erfüllt, Restrisiko${r.appr ? " am " + de(r.appr) : ""}${r.apprBy ? " von " + r.apprBy : ""} genehmigt${r.risk ? ", Risikoanalyse " + r.risk : ""}.`;
const actRow = a => `<div><span class="id">${esc(a.id)}</span> ${esc(a.x)}${a.resp ? ` <span class="small">verantwortlich: ${esc(a.resp)}</span>` : ""}</div>`;
const CATURL = D.catalogUrl || "#";

const R = D.reqs, TODAY = D.run.date;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const de = d => d ? d.slice(8,10) + "." + d.slice(5,7) + "." + d.slice(0,4) : "";
const byNum = (a, b) => a.localeCompare(b, "de", { numeric: true });
const overdue = id => { const p = R[id]?.poam; return !!(p && p.dl && p.dl < TODAY); };
const glyph = id => { const r = R[id]; return r ? `<i class="sq ${r.st}${r.m ? " m" : ""}${overdue(id) ? " od" : ""}" aria-hidden="true"></i>` : ""; };
const checkSet = new Map(D.checks.map(c => [c.id, c]));
const trial = new Set(D.trial);
const gid = t => "g-" + t.slice(2);

// Kennung als Link, mit Titel und Stand
function ref(id, note) {
  const r = R[id], e = D.ext[id];
  const t = r ? r.t : e ? e.t : "";
  const q = r ? stLabel(r) + (r.m ? ", gemessen" : "") : D.na[id] !== undefined ? "nicht anwendbar" : e ? "nicht im Profil" : "nicht im Katalog-Auszug";
  const a = (r || e) ? `<a class="id" href="#${esc(id)}">${esc(id)}</a>` : `<span class="id">${esc(id)}</span>`;
  return `<div class="ref">${glyph(id)}${a}<span class="t">${esc(t)}</span><span class="q">${esc(q)}${note ? " · " + esc(note) : ""}</span></div>`;
}
const list = (ids, note) => ids.length ? ids.map(i => ref(i, note && note(i))).join("") : `<span class="none">keine</span>`;

// Kopf, Satz, Läufe
document.getElementById("proj").textContent = "· " + D.run.project;
document.getElementById("meta").innerHTML = `<span>Stand ${de(D.run.date)} ${D.run.time}</span><span>Commit ${D.run.sha}</span><span><a href="${CATURL}" target="_blank" rel="noopener">Katalog ${D.catalog.slice(0,7)}</a></span>`;
const ids = D.order, n = ids.length;
const cnt = k => ids.filter(i => R[i].st === k).length;
const meas = ids.filter(i => R[i].m).length;
const pItems = ids.filter(i => R[i].poam);
const od = ids.filter(overdue);
const devs = ids.filter(i => R[i].dev);
const nas = Object.keys(D.na).sort(byNum);
const nfc = k => ids.filter(i => R[i].st !== "I" && R[i].nf === k).length;
document.getElementById("sum").innerHTML =
  `<b class="num">${cnt("I")}</b> von ${n} Anforderungen sind erfüllt, <b class="num">${cnt("P") + cnt("L")}</b> nicht erfüllt (${cnt("P")} teilweise, ${cnt("L")} geplant` +
  (nfc("temporary") + nfc("permanent") ? `; ${nfc("temporary")} temporär, ${nfc("permanent")} dauerhaft` : "") + `). ` +
  (nas.length ? `<a href="#nicht-anwendbar"><b class="num">${nas.length}</b> weitere sind nicht anwendbar</a>. ` : "") +
  `<b class="num">${meas}</b> sind durch eine Prüfung gemessen. Der Maßnahmenplan hat <b class="num">${pItems.length}</b> Punkte` +
  (devs.length ? `, davon <b class="num">${devs.length}</b> genehmigte Abweichungen` : "") +
  (od.length ? `, bei <a href="#massnahmen" class="bad">${od.length} ist der Termin überschritten</a>.` : ".");
(function runs() {
  const svg = document.getElementById("runsvg"), W = 420, H = 34, rs = D.runs;
  const t0 = Date.parse(rs[0].d + "T" + rs[0].t), t1 = Date.parse(rs.at(-1).d + "T" + rs.at(-1).t);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio", "none");
  let s = `<line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--rule)" stroke-width="1"/>`;
  rs.forEach((r, i) => {
    const x = 2 + (Date.parse(r.d + "T" + r.t) - t0) / (t1 - t0) * (W - 4), last = i === rs.length - 1;
    s += `<line x1="${x}" x2="${x}" y1="${r.ok ? 4 : H/2}" y2="${r.ok ? H/2 : H-4}" stroke="${r.ok ? "var(--mark)" : "var(--bad)"}" stroke-width="${last ? 3 : 1.6}"><title>Lauf ${de(r.d)} ${r.t}: ${r.ok ? "alles erfüllt" : r.n + " nicht erfüllt"}</title></line>`;
  });
  svg.innerHTML = s;
  const ok = rs.filter(r => r.ok).length;
  document.getElementById("runcap").innerHTML = `Läufe ${de(rs[0].d).slice(0,6)} bis ${de(rs.at(-1).d)}: <span class="num">${ok}</span> mit allen Messungen erfüllt (oben), <span class="num">${rs.length - ok}</span> mit nicht erfüllten (unten). Der letzte ist dick.`;
})();

// Verzeichnis
const FILTERS = [["alle", "Alle", () => true], ["luecke", "Lücken", i => R[i].st !== "I"], ["gemessen", "Gemessen", i => R[i].m], ["termin", "Termin überschritten", overdue], ["ohne", "Ohne Maßnahme", i => R[i].poam?.na], ["abw", "Abweichung genehmigt", i => R[i].dev]];
let filt = "alle";
try { filt = localStorage.getItem("reg-filter") || "alle"; } catch (e) {}
const practices = [];
ids.forEach(i => { const r = R[i]; let p = practices.find(x => x.g === r.g); if (!p) practices.push(p = { g: r.g, gt: r.gt, ids: [] }); p.ids.push(i); });
function drawFilters() {
  document.getElementById("filters").innerHTML = FILTERS.map(([k, l]) => `<button type="button" id="f-${k}" data-f="${k}" aria-pressed="${k === filt}">${l}</button>`).join("");
}
function drawReg(cur) {
  const test = FILTERS.find(f => f[0] === filt)[2];
  document.getElementById("reg").innerHTML = practices.map(p => {
    const done = p.ids.filter(i => R[i].st === "I").length;
    return `<div class="prac"><div class="lbl"><span class="id">${esc(p.g)}</span>${esc(p.gt)}</div><div class="cells">` +
      p.ids.map(i => `<a href="#${i}" title="${esc(i + " " + R[i].t + " · " + ST[R[i].st])}" aria-label="${esc(i + " " + R[i].t)}"${i === cur ? ' aria-current="true"' : ""} class="${test(i) ? "" : "dim"}">${glyph(i)}</a>`).join("") +
      `</div><div class="cnt">${done} von ${p.ids.length} erfüllt</div></div>`;
  }).join("");
}
document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  filt = b.dataset.f; try { localStorage.setItem("reg-filter", filt); } catch (err) {}
  drawFilters(); drawReg(current);
});

// Akte: Ansichten
function viewReq(id) {
  const r = R[id];
  const pm = r.poam;
  let plan = `<span class="none">kein Punkt</span>`;
  if (r.dev) plan = `<div>${esc(devText(r))}</div>` + (pm ? pm.a.map(actRow).join("") : "");
  else if (pm) plan = pm.na ? `<span class="warn">Im Plan, aber ohne Maßnahme und ohne Termin</span>` :
    (pm.a.map(actRow).join("") +
     (pm.dl ? `<div class="${pm.dl < TODAY ? "bad" : "small"}">Termin ${de(pm.dl)}${pm.dl < TODAY ? ", überschritten" : ""}</div>` : ""));
  const chk = r.c.length ? r.c.map(c => `<div class="ref"><a class="id" href="#check-${esc(c)}">${esc(c)}</a><span class="t">${esc(checkSet.get(c)?.t || "")}</span>${trial.has(c) ? '<span class="tag">auf Probe</span>' : ""}${D.by[c] ? `<span class="q">durchgeführt von ${esc(D.by[c])}</span>` : ""}</div>`).join("") : `<span class="none">keine Prüfung</span>`;
  const isoL = r.iso.length ? r.iso.map(x => `<div class="ref"><a class="id" href="#iso-${x.id}">A.${x.id}</a><span class="t">${ISO_THEME[x.id.split(".")[0]]}</span><span class="q">${REL[x.rel] || x.rel}</span></div>`).join("") : `<span class="none">keine Zuordnung im Mapping</span>`;
  const thr = r.thr.length ? r.thr.map(t => `<div class="ref"><a class="id" href="#${gid(t)}">${esc(t)}</a><span class="t">${esc(THREAT[t] || "")}</span></div>`).join("") : `<span class="none">keine</span>`;
  return `
    <div class="crumb"><span><a href="#">${esc(r.g)} ${esc(r.gt)}</a></span><span>${esc(r.s)} ${esc(r.stt)}</span>${r.p ? `<span><a href="#${r.p}">${esc(r.p)}</a></span>` : ""}</div>
    <h1><span class="id">${esc(id)}</span>${esc(r.t)}</h1>
    <p class="lead">${esc(r.stm).replace(/\b(MUSS|SOLLTE|KANN)\b/, '<span class="mv">$1</span>')}</p>
    ${r.gdn ? `<details class="hint"><summary>Umsetzungshinweise des BSI</summary><p>${esc(r.gdn)}</p></details>` : ""}
    <dl class="facts">
      <dt>Stand im Plan</dt><dd><div class="ref">${glyph(id)}<span>${stLabel(r)}${r.m ? ", durch Prüfung gemessen" : ", nicht gemessen"}</span></div>${r.rev || r.revBy ? `<span class="small">Bewertet${r.rev ? " am " + de(r.rev) : ""}${r.revBy ? " von " + esc(r.revBy) : ""}</span>` : ""}</dd>
      <dt>Prüfungen</dt><dd>${chk}</dd>
      <dt>Maßnahmenplan</dt><dd>${plan}</dd>
      <dt>Gehört zu</dt><dd>${r.p ? ref(r.p) : `<span class="none">oberste Ebene in ${esc(r.s)}</span>`}</dd>
      <dt>Teilanforderungen</dt><dd>${list(r.k)}</dd>
      <dt>Setzt voraus</dt><dd>${list(r.req)}</dd>
      <dt>Voraussetzung für</dt><dd>${list(r.reqBy)}</dd>
      <dt>Verwandt</dt><dd>${list(r.rel)}</dd>
      <dt>ISO/IEC 27001</dt><dd>${isoL}</dd>
      <dt>Gefährdungen</dt><dd>${thr}</dd>
      <dt>Nachweis</dt><dd><span>${esc(r.doc || "nicht angegeben")}</span><span class="small">Schutzniveau ${esc(r.lvl)} · ${esc(r.mv)}</span></dd>
    </dl>
    <div class="src">Text, Hinweise und Bezüge aus dem Grundschutz++-Katalog @ ${D.catalog.slice(0,7)}, Normen aus dem BSI-Mapping ISO 27001 zu Grundschutz++. Stand und Maßnahmen aus dem Lauf vom ${de(D.run.date)} ${D.run.time}.</div>`;
}
function viewExt(id) {
  const e = D.ext[id];
  const back = ids.filter(i => [R[i].p, ...R[i].k, ...R[i].req, ...R[i].reqBy, ...R[i].rel].includes(id));
  return `<div class="crumb"><span>Katalog</span>${e.p ? `<span><a href="#${e.p}">${esc(e.p)}</a></span>` : ""}</div>
    <h1><span class="id">${esc(id)}</span>${esc(e.t)}</h1>
    <p class="lead">${esc(e.stm)}</p>
    ${D.na[id] !== undefined ? `<p class="small">Nicht anwendbar laut Profil. Es gibt für sie keinen Stand, keine Prüfung und keinen Maßnahmenplan.</p>` : `<p class="small">Diese Anforderung ist nicht im Profil des Systems. Es gibt für sie keinen Stand, keine Prüfung und keinen Maßnahmenplan.</p>`}
    <dl class="facts">${D.na[id] !== undefined ? `<dt>Begründung</dt><dd>${esc(D.na[id] || "keine angegeben")}</dd>` : ""}<dt>Bezug aus dem Profil</dt><dd>${list(back)}</dd></dl>`;
}
function viewCheck(cid) {
  const c = checkSet.get(cid);
  const reqs = ids.filter(i => R[i].c.includes(cid));
  return `<div class="crumb"><span><a href="#pruefungen">Prüfungen</a></span></div>
    <h1><span class="id">${esc(cid)}</span>${esc(c?.t || "")}</h1>
    <p class="lead">${trial.has(cid) ? "Diese Prüfung läuft auf Probe. Sie erscheint im Plan, zählt aber nicht als Messung." : c ? `Methode ${esc(c.m)}. Sie belegt ${c.r.length} Anforderung${c.r.length === 1 ? "" : "en"}.` : "Für diese Prüfung liegt im Datenstand keine Beschreibung vor."}</p>
    <dl class="facts"><dt>Belegt laut Plan</dt><dd>${list(reqs)}</dd>${c ? `<dt>Laut Prüfplan</dt><dd>${list(c.r)}</dd>` : ""}</dl>`;
}
function viewIso(x) {
  const rows = (D.iso[x] || []).slice().sort((a, b) => byNum(a.id, b.id));
  const inP = rows.filter(t => R[t.id]), out = rows.filter(t => !R[t.id]);
  return `<div class="crumb"><span><a href="#normen">ISO/IEC 27001:2022</a></span><span>Anhang A</span><span>${ISO_THEME[x.split(".")[0]]}</span></div>
    <h1><span class="id">A.${esc(x)}</span>ISO/IEC 27001:2022, Anhang A ${esc(x)}</h1>
    <p class="lead">Laut BSI-Mapping führt dieses Control zu ${rows.length} Grundschutz++-Anforderungen. ${inP.length} davon sind im Profil.</p>
    <dl class="facts"><dt>Im Profil</dt><dd>${inP.length ? inP.map(t => ref(t.id, REL[t.rel] || t.rel)).join("") : '<span class="none">keine</span>'}</dd>
    <dt>Nicht im Profil</dt><dd>${out.length ? out.map(t => ref(t.id, REL[t.rel] || t.rel)).join("") : '<span class="none">keine</span>'}</dd></dl>
    <div class="src">Die Titel der ISO-Controls stehen nicht im Mapping und sind hier nicht wiedergegeben.</div>`;
}
function viewThreat(t) {
  const hit = ids.filter(i => R[i].thr.includes(t));
  return `<div class="crumb"><span><a href="#gefaehrdungen">Elementare Gefährdungen</a></span></div>
    <h1><span class="id">${esc(t)}</span>${esc(THREAT[t] || "")}</h1>
    <p class="lead">${hit.length} Anforderungen im Profil nennen diese Gefährdung, ${hit.filter(i => R[i].st === "I").length} davon sind erfüllt.</p>
    <dl class="facts"><dt>Anforderungen</dt><dd>${list(hit.sort((a, b) => "ILP".indexOf(R[b].st) - "ILP".indexOf(R[a].st) || byNum(a, b)))}</dd></dl>`;
}
function viewOverview() {
  const rows = practices.map(p => {
    const c = k => p.ids.filter(i => R[i].st === k).length;
    return `<tr><td><span class="id">${esc(p.g)}</span> ${esc(p.gt)}</td><td class="n">${p.ids.length}</td><td class="n">${c("I")}</td><td class="n">${c("P")}</td><td class="n">${c("L")}</td><td class="n">${p.ids.filter(i => R[i].m).length}</td><td class="n${p.ids.some(overdue) ? " bad" : ""}">${p.ids.filter(overdue).length}</td></tr>`;
  }).join("");
  return `<h1>Übersicht nach Praxis</h1>
    <p class="lead">Jedes Kästchen links ist eine Anforderung des Profils. Ein Klick öffnet sie mit Text, Prüfungen, Maßnahmen und allen Bezügen.</p>
    <div class="tw"><table><thead><tr><th>Praxis</th><th>Anforderungen</th><th>erfüllt</th><th>nicht erfüllt: teilweise</th><th>nicht erfüllt: geplant</th><th>gemessen</th><th>Termin überschritten</th></tr></thead><tbody>${rows}</tbody></table></div>${viewNA()}`;
}
function viewNA() {
  if (!nas.length) return "";
  return `<h2 id="nicht-anwendbar">Nicht anwendbar</h2><p class="lead">${nas.length} Anforderungen nimmt das Profil aus, jede mit ihrer Begründung.</p>
    <div class="tw"><table><thead><tr><th>Anforderung</th><th>Begründung</th></tr></thead><tbody>` +
    nas.map(i => `<tr><td>${D.ext[i] ? `<a class="id" href="#${esc(i)}">${esc(i)}</a>` : `<span class="id">${esc(i)}</span>`} <span class="small">${esc(D.ext[i]?.t || "")}</span></td><td>${esc(D.na[i] || "keine angegeben")}</td></tr>`).join("") +
    `</tbody></table></div>`;
}
function viewChecks() {
  const all = [...D.checks.map(c => c.id), ...D.trial].sort(byNum);
  return `<h1>Prüfungen</h1><p class="lead">${D.checks.length} Prüfungen sind veröffentlicht, ${D.trial.length} laufen auf Probe.</p>
    <div class="tw"><table><thead><tr><th>Prüfung</th><th>Beschreibung</th><th>Methode</th><th>Anforderungen</th></tr></thead><tbody>` +
    all.map(id => { const c = checkSet.get(id), rs = ids.filter(i => R[i].c.includes(id));
      return `<tr><td><a class="id" href="#check-${esc(id)}">${esc(id)}</a>${trial.has(id) ? ' <span class="tag">auf Probe</span>' : ""}</td><td>${esc(c?.t || "")}</td><td>${esc(c?.m || "")}</td><td>${rs.map(i => `<a class="id" href="#${i}">${i}</a>`).join(", ")}</td></tr>`; }).join("") +
    `</tbody></table></div>`;
}
function viewPlan() {
  const rs = pItems.slice().sort((a, b) => (R[a].poam.dl || "9999").localeCompare(R[b].poam.dl || "9999") || byNum(a, b));
  return `<h1>Maßnahmenplan</h1><p class="lead">${pItems.length} Punkte: ${pItems.filter(i => R[i].poam.dl).length} mit Termin, ${pItems.filter(i => R[i].poam.na).length} ohne Maßnahme, ${pItems.filter(i => R[i].dev).length} genehmigte Abweichungen. Sortiert nach Termin.</p>
    <div class="tw"><table><thead><tr><th>Termin</th><th>Anforderung</th><th>Maßnahme</th></tr></thead><tbody>` +
    rs.map(i => { const p = R[i].poam;
      return `<tr><td class="n ${overdue(i) ? "bad" : ""}">${p.dl ? de(p.dl) : "–"}</td><td><div class="ref">${glyph(i)}<a class="id" href="#${i}">${i}</a></div><span class="small">${esc(R[i].t)}</span></td><td>${R[i].dev ? `<div>${esc(devText(R[i]))}</div>` + p.a.map(actRow).join("") : p.na ? '<span class="warn">ohne Maßnahme</span>' : p.a.map(actRow).join("")}</td></tr>`; }).join("") +
    `</tbody></table></div>`;
}
function viewNorms() {
  const xs = Object.keys(D.iso).sort(byNum);
  return `<h1>ISO/IEC 27001:2022, Anhang A</h1><p class="lead">${xs.length} Controls des Anhangs führen laut BSI-Mapping zu Anforderungen dieses Profils.</p>
    <div class="tw"><table><thead><tr><th>Control</th><th>Thema</th><th>im Profil</th><th>erfüllt</th></tr></thead><tbody>` +
    xs.map(x => { const t = D.iso[x].filter(y => R[y.id]); return `<tr><td><a class="id" href="#iso-${x}">A.${x}</a></td><td>${ISO_THEME[x.split(".")[0]]}</td><td class="n">${t.length}</td><td class="n">${t.filter(y => R[y.id].st === "I").length}</td></tr>`; }).join("") +
    `</tbody></table></div>`;
}
function viewThreats() {
  const ts = [...new Set(ids.flatMap(i => R[i].thr))].sort((a, b) => parseFloat(a.slice(2)) - parseFloat(b.slice(2)) || byNum(a, b));
  return `<h1>Elementare Gefährdungen</h1><p class="lead">Welche Gefährdungen die Anforderungen des Profils adressieren und wie weit sie umgesetzt sind.</p>
    <div class="tw"><table><thead><tr><th>Gefährdung</th><th>Anforderungen</th><th>erfüllt</th></tr></thead><tbody>` +
    ts.map(t => { const h = ids.filter(i => R[i].thr.includes(t)); return `<tr><td><a class="id" href="#${gid(t)}">${esc(t)}</a> ${esc(THREAT[t] || "")}</td><td class="n">${h.length}</td><td class="n">${h.filter(i => R[i].st === "I").length}</td></tr>`; }).join("") +
    `</tbody></table></div>`;
}

// Navigation über den Anker: jede Kennung ist eine Adresse, Zurück funktioniert
let current = null;
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  let html, tab = "";
  current = R[h] ? h : null;
  if (R[h]) html = viewReq(h);
  else if (D.ext[h]) html = viewExt(h);
  else if (h.startsWith("check-")) { html = viewCheck(h.slice(6)); tab = "#pruefungen"; }
  else if (h.startsWith("iso-")) { html = viewIso(h.slice(4)); tab = "#normen"; }
  else if (h.startsWith("g-")) { html = viewThreat("G " + h.slice(2)); tab = "#gefaehrdungen"; }
  else if (h === "pruefungen") { html = viewChecks(); tab = "#pruefungen"; }
  else if (h === "massnahmen") { html = viewPlan(); tab = "#massnahmen"; }
  else if (h === "normen") { html = viewNorms(); tab = "#normen"; }
  else if (h === "gefaehrdungen") { html = viewThreats(); tab = "#gefaehrdungen"; }
  else if (h === "nicht-anwendbar") { html = viewOverview(); tab = "#"; }
  else { html = viewOverview(); tab = "#"; }
  const f = document.getElementById("file");
  f.innerHTML = html;
  document.querySelectorAll("#tabs a").forEach(a => { if (a.getAttribute("href") === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  drawReg(current);
  if (h === "nicht-anwendbar") document.getElementById(h)?.scrollIntoView({ block: "start" });
  else if (h && f.getBoundingClientRect().top < 0) f.scrollIntoView({ block: "start" });
}
drawFilters();
window.addEventListener("hashchange", route);
route();
</script>
